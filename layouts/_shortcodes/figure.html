{{- $src := strings.TrimPrefix "/" (.Get "src") | relURL -}}
<figure>
  {{ with .Get "link" }}<a href="{{ . }}">{{ end }}
  <img src="{{ $src }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async"{{ with .Get "width" }} width="{{ . }}"{{ end }}{{ with .Get "height" }} height="{{ . }}"{{ end }}>
  {{ if .Get "link" }}</a>{{ end }}
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
