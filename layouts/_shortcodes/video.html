{{- $src := strings.TrimPrefix "/" (.Get "src") -}}
{{- if not $src -}}
  {{- errorf "The video shortcode requires a src parameter: %s" .Position -}}
{{- end -}}
<figure>
  <video controls playsinline preload="metadata"{{ with .Get "poster" }} poster="{{ strings.TrimPrefix "/" . | relURL }}"{{ end }}>
    <source src="{{ $src | relURL }}" type="video/mp4">
    Your browser does not support embedded video. <a href="{{ $src | relURL }}">Download the video</a>.
  </video>
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
